# Full test suite on a 7GB GitHub runner.
#
# The build box is memory-starved (~3.9GB total, <2.2GB usable), so the
# 100M-scale test files (tests/test_tiny_100m.py, tests/test_safetensors_io.py)
# are conftest-skipped there and individual 100M tests OOM-kill even at
# ~2.1GB MemAvailable. CI runners provide the adequate-memory host the 100M
# validation ladder requires: MemAvailable stays far above the 900MB gate, so
# the conftest never skips and the whole suite runs unconditioned.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned deps (torch 2.13 CPU)
        run: |
          python -m pip install --no-cache-dir "torch==2.13.*" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir numpy pytest safetensors

      - name: Run full test suite (no memory skips expected)
        run: |
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m pytest -q --no-header -o tmp_path_retention_policy=none

      - name: Assert no conftest memory-skips occurred
        run: |
          # The 7GB runner must clear the 900MB conftest gate; a skip here
          # means the environment regressed, not that tests are optional.
          OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m pytest -q --no-header -rs tests/test_tiny_100m.py tests/test_safetensors_io.py 2>&1 | tee /tmp/heavy.log
          if grep -q "skipped to avoid an OOM kill" /tmp/heavy.log; then
            echo "::error::100M-scale tests were conftest-skipped on CI — runner memory regressed below 900MB"
            exit 1
          fi
